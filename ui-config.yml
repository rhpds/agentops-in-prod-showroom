---
type: showroom

# Set the left column width to 30%
default_width: 30
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # OCP Console - embedded OpenShift web console
  - name: OCP Console
    url: 'https://console-openshift-console.%DOMAIN%'

  # Terminal access via showroom terminal container
  - name: Terminal
    path: /terminal
    port: 443

  # MLflow Console - embedded MLflow tracking UI
  - name: MLflow Console
    url: 'https://rh-ai.%DOMAIN%/mlflow/'

  # Mortgage AI App - multi-agent loan origination UI
  - name: Mortgage AI App
    url: 'https://mortgage-ai-ui-route-wksp-user1.%DOMAIN%'

  # External documentation
  - name: MLflow Docs
    url: 'https://mlflow.org/docs/latest/genai/tracing/'

  - name: RHOAI Docs
    url: 'https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/'
